# Publishes this server to the Official MCP Registry via GitHub Actions OIDC.
#
# Why OIDC: interactive `mcp-publisher login github` uses a device-flow token
# WITHOUT the read:org scope, so the registry cannot see org membership and
# only grants io.github.<username>/* (registry issue #398). OIDC from a
# workflow in this org's repo proves org ownership directly — no secrets.
#
# npm publishing is NOT done here: @vibeads/mcp is published from the source
# monorepo. This workflow only records the (already-live) npm version in the
# registry. Trigger: push a tag like v0.2.6, or run manually.
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
